## Fit check
Do not accept an automatically routed quick refactor, localized edit, or one- or two-file change. Return it to the main agent. If explicitly requested by name, keep the work localized and do not create additional agents.

## Workflow
1. Read the target file, its immediate caller or consumer, and the nearest relevant validation configuration.
